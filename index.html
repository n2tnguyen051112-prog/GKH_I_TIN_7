 người lớn và kiểm tra thông tin chính thức","Gửi mật khẩu trước","Chia sẻ cho lớp"],"a":1,"exp":"Không cung cấp mật khẩu hoặc mở link đáng ngờ."},{"id":"N11","num":11,"kind":"mc","cat":"Mạng xã hội & an toàn số","source":"Bổ sung","q":"Một tin gây sốc chưa có nguồn đáng tin cậy đang được chia sẻ rất nhiều. Em nên làm gì?","opts":["Đăng lại ngay","Chỉ tin vì nhiều lượt chia sẻ","Kiểm chứng nguồn rồi mới chia sẻ","Thêm thông tin tưởng tượng"],"a":2,"exp":"Số lượt chia sẻ không chứng minh tính chính xác."},{"id":"N12","num":12,"kind":"mc","cat":"Mạng xã hội & an toàn số","source":"Bổ sung","q":"Cách nào góp phần bảo vệ quyền riêng tư khi dùng mạng xã hội?","opts":["Đặt bài đăng ở chế độ phù hợp và hạn chế dữ liệu cá nhân","Công khai địa chỉ nhà","Đưa mật khẩu cho bạn","Chấp nhận mọi lời mời"],"a":0,"exp":"Chọn quyền riêng tư phù hợp và hạn chế công khai dữ liệu cá nhân."}],"essays":[{"short":"Máy in và phần mềm độc hại","q":"a) Máy in thuộc nhóm thiết bị nào? b) Nếu máy in in ra các kí hiệu lạ do virus, em cần kiểm tra và diệt virus ở máy in hay máy tính? Giải thích.","answer":"a) Máy in là thiết bị ra, đưa thông tin từ máy tính ra giấy.\n\nb) Theo tình huống của đề, cần kiểm tra và quét mã độc trên máy tính (nguồn gửi dữ liệu/lệnh in), vì virus có thể làm hỏng dữ liệu hay lệnh in trước khi chuyển sang máy in. Ngoài ra cần kiểm tra trình điều khiển máy in và kết nối nếu lỗi còn tiếp diễn."},{"short":"Hệ điều hành và ứng dụng","q":"Phân biệt phần mềm hệ thống và phần mềm ứng dụng. Mỗi loại nêu hai ví dụ.","answer":"Phần mềm hệ thống quản lí và điều khiển hoạt động chung của máy tính, tạo môi trường cho ứng dụng làm việc. Ví dụ: Windows, Linux.\nPhần mềm ứng dụng giúp người dùng thực hiện công việc cụ thể. Ví dụ: Microsoft Word, Paint."},{"short":"Tổ chức tệp và thư mục","q":"Trình bày cách tổ chức dữ liệu trong máy tính bằng tệp và thư mục. Sắp xếp tệp vào thư mục phù hợp có lợi ích gì?","answer":"Tệp lưu trữ dữ liệu có tên; thư mục chứa tệp và có thể chứa các thư mục con. Người dùng đặt tên dễ hiểu, tạo thư mục theo môn học/chủ đề, chuyển tệp vào đúng vị trí. Cấu trúc này giúp tìm nhanh, quản lí tốt, hạn chế nhầm lẫn và hỗ trợ sao lưu."},{"short":"Mạng xã hội: lợi ích và rủi ro","q":"Mạng xã hội là gì? Hãy nêu ba lợi ích và hai tác hại của mạng xã hội đối với học sinh.","answer":"Mạng xã hội là môi trường trực tuyến để kết nối, giao lưu, trao đổi và chia sẻ thông tin.\nBa lợi ích: (1) kết nối với bạn bè; (2) trao đổi kiến thức, học nhóm; (3) chia sẻ thông tin, hoạt động tích cực.\nHai tác hại: (1) lộ dữ liệu cá nhân, bị lừa đảo; (2) dành quá nhiều thời gian gây ảnh hưởng học tập và sức khỏe."},{"short":"Vai trò của hệ điều hành","q":"a) Vai trò của hệ điều hành và phần mềm ứng dụng khác nhau như thế nào? b) Nêu một vài hệ điều hành em biết.","answer":"a) Hệ điều hành quản lí phần cứng, tệp, tài nguyên và cung cấp môi trường hoạt động cho ứng dụng; ứng dụng giúp làm một công việc cụ thể như soạn văn bản, vẽ hoặc học ngoại ngữ.\nb) Ví dụ: Windows, Linux, macOS, Android, iOS."},{"short":"Tình huống học tập số an toàn","q":"Bạn học sinh sử dụng máy tính để học tập, lưu bài tập và trao đổi thông tin. a) Nêu một thiết bị vào và một thiết bị ra. b) Nêu một ứng dụng phục vụ học tập. c) Đề xuất cách sắp xếp tệp. d) Nêu hai lưu ý về an toàn mạng xã hội.","answer":"a) Bàn phím (thiết bị vào), màn hình hoặc máy in (thiết bị ra).\nb) Ví dụ Duolingo để học ngoại ngữ, Microsoft Word để soạn bài.\nc) Tạo thư mục Học tập, trong đó có thư mục Toán, Tin, Văn…; đặt tên tệp rõ nghĩa.\nd) Không công khai mật khẩu/địa chỉ nhà; không bấm vào liên kết lạ và kiểm chứng thông tin trước khi chia sẻ."},{"short":"Tạo cây thư mục D:\\Hoc tap","q":"Sơ đồ cây thư mục: D:\\ → Hoc tap → Toan và Tin. Em hãy nêu các bước tạo cây thư mục này.","answer":"Bước 1. Mở File Explorer và vào ổ đĩa D:\\.\nBước 2. Tạo thư mục mới tên “Hoc tap” (New → Folder, nhập tên).\nBước 3. Mở thư mục “Học tập”, tạo thư mục con tên “Toan”.\nBước 4. Tiếp tục tạo thư mục con tên “Tin”.\nKết quả: D:\\Hoc tap\\Toan và D:\\Hoc tap\\Tin."}]};

ứ tự của tài liệu.</p>`;
 view.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{currentCat=Number(b.dataset.lesson);go('lesson')});view.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>b.dataset.mode==='essays'?go('essays'):begin(b.dataset.mode));setFooter('Chọn bài hoặc chế độ luyện tập','',null)}
function renderLesson(){const c=COURSES[currentCat];view.innerHTML=`<div class="eyebrow">HỌC THEO BÀI</div><h1 class="title">${c.icon} ${esc(c.title)}</h1><p class="muted">${esc(c.description)} · Kiến thức từ SGK Tin học 7 (Kết nối tri thức).</p><div class="card"><div class="section-label" style="margin-top:0">💡 Kiến thức cần nhớ</div>${c.facts.map(t=>`<div class="fact">${esc(t)}</div>`).join('')}</div><div class="warning">🧠 Hãy đọc kiến thức trước rồi chọn luyện tập. Mỗi lần chơi, một câu hỏi vừa màn hình và đáp án được chấm ngay.</div><div class="actions"><button class="action primary" id="practice">▶ Luyện bài này</button><button class="action soft" id="more">✦ Câu nâng cao</button></div>`;$('#practice').onclick=()=>begin('topic',c.title);$('#more').onclick=()=>begin('advanced',c.title);setFooter('Kiến thức thuộc bài '+(currentCat+1),'← Danh sách bài',home)}
function begin(mode,cat){let items=[],label='';if(mode==='topic'){items=mc.filter(q=>q.cat===cat);label=cat}else if(mode==='all'){items=[...mc];label='26 câu trắc nghiệm'}else if(mode==='tf'){items=[...tf];label='32 ý Đúng – Sai'}else if(mode==='mix'){items=shuffle([...mc,...tf]).slice(0,15);label='Thử thách 15 câu'}else if(mode==='advanced'){items=bonus.filter(q=>!cat||q.cat===cat);label=cat?'Nâng cao · '+cat:'Vận dụng nâng cao';if(!items.length){items=[...bonus];label='Vận dụng nâng cao'}}else if(mode==='wrong'){const w=new Set(progress.wrong);items=[...mc,...tf,...bonus].filter(q=>w.has(q.id));label='Ôn lại câu chưa đúng';if(!items.length){alert('Chưa có câu sai được lưu. Sếp hãy thử một vòng ôn tập trước nhé!');return}} if(!items.length)return;
 try{if(window.PlayStats?.begin && window.PlayStats.begin(label)===false){return}}catch(e){console.warn('Bộ thống kê chưa gửi được',e)}
 session={items,mode,label,at:0,correct:0,answers:[],locked:false,started:Date.now()};go('quiz')}
function renderQuiz(){const q=session.items[session.at],pos=session.at+1,total=session.items.length;view.innerHTML=`<div class="quizhead"><span class="pill">${q.kind==='tf'?'⚖️ ĐÚNG – SAI':q.source==='Bổ sung'?'🚀 NÂNG CAO':'🎮 TRẮC NGHIỆM'}</span><span class="smallcount">CÂU ${pos}/${total}</span></div><div class="progress"><div style="width:${(pos-1)/total*100}%"></div></div><div class="eyebrow">${esc(q.cat)} · ${q.kind==='tf'?`Nhóm ${q.num}, ý ${q.letter}`:q.source==='Bổ sung'?'Câu mới':`Đề câu ${q.num}`}</div>${q.group?`<div class="grouptext">${esc(q.group)}</div>`:''}<h2 class="question">${esc(q.q)}</h2><div class="options">${q.kind==='tf'?[['true','Đúng'],['false','Sai']].map(([k,v])=>`<button class="option" data-answer="${k}" type="button"><span class="letter">${k==='true'?'Đ':'S'}</span>${v}</button>`).join(''):q.opts.map((text,i)=>`<button class="option" data-answer="${i}" type="button"><span class="letter">${'ABCD'[i]}</span><span>${esc(text)}</span></button>`).join('')}</div><div id="feedback-area"></div>`;
 view.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));session.locked=false;setFooter('Chọn đáp án để xem kết quả ngay','Câu tiếp theo →',null)}
function choose(input){if(!session||session.locked)return;const q=session.items[session.at],pick=q.kind==='tf'?(input==='true'):Number(input),right=pick===q.a;session.locked=true;session.answers.push({id:q.id,right,pick});if(right)session.correct++;sound(right);
 view.querySelectorAll('[data-answer]').forEach(btn=>{btn.disabled=true;const val=q.kind==='tf'?btn.dataset.answer==='true':Number(btn.dataset.answer);if(val===q.a)btn.classList.add('right');else if(val===pick)btn.classList.add('wrong');else btn.classList.add('ghost')});
 const txt=right?'Chính xác! 🎉':'Chưa đúng, cùng xem lại nhé!';const ans=q.kind==='tf'?(q.a?'Đúng':'Sai'):('Đáp án '+ 'ABCD'[q.a]+': '+q.opts[q.a]);$('#feedback-area').innerHTML=`<div class="feedback ${right?'':'bad'}" role="status" aria-live="polite"><b>${txt}</b><p><strong>${esc(ans)}.</strong> ${esc(q.exp||'Dựa trên nội dung kiến thức trong SGK và đề cương.')}</p></div>`;setFooter(right?'Bạn đã ghi thêm 1 điểm!':'Đọc giải thích để nhớ lâu hơn',session.at+1===session.items.length?'Xem kết quả →':'Câu tiếp theo →',nextQuestion)}
function nextQuestion(){if(!session||!session.locked)return;if(session.at+1<session.items.length){session.at++;renderQuiz();main.scrollTop=0}else complete()}
function complete(){const total=session.items.length;let percent=Math.round(session.correct/total*100);progress.rounds++;progress.best=Math.max(progress.best,percent);const wrong=new Set(progress.wrong);session.answers.forEach(a=>a.right?wrong.delete(a.id):wrong.add(a.id));progress.wrong=[...wrong];persist();try{window.PlayStats?.finish?.({score:session.correct,maxScore:total,correct:session.correct,total,mode:session.label,percent})}catch(e){console.warn('Thống kê chưa cập nhật',e)}go('result')}
function renderResult(){const p=Math.round(session.correct*100/session.items.length);view.innerHTML=`<div class="result-score"><div class="eyebrow" style="color:#adebdc">HOÀN THÀNH VÒNG LUYỆN</div><div class="number">${p}%</div><div style="font-size:20px;font-weight:950">${session.correct} / ${session.items.length} câu đúng</div><p>${esc(session.label)}</p></div><div class="card"><h2 class="section-label" style="margin:0 0 8px">${p===100?'🏆 Xuất sắc!':p>=70?'🌟 Tiến bộ tốt!':'💪 Tiếp tục luyện nhé!'}</h2><p class="muted">Hệ thống đã lưu kết quả và các câu sai trên thiết bị này. Hãy luyện lại để ghi nhớ chắc hơn.</p><div class="stats"><div class="stat"><b>${session.correct}</b><span>Đúng</span></div><div class="stat"><b>${session.items.length-session.correct}</b><span>Cần ôn</span></div><div class="stat"><b>${progress.best}%</b><span>Kỷ lục</span></div></div></div><div class="actions"><button class="action primary" id="again">↻ Chơi lại</button><button class="action soft" id="wrong">🎯 Ôn câu sai</button></div>`;$('#again').onclick=()=>begin(session.mode,session.mode==='topic'?session.items[0].cat:undefined);$('#wrong').onclick=()=>begin('wrong');setFooter('Kết quả lưu trên máy của học sinh','Về chọn môn →',home)}
function renderEssayList(){view.innerHTML=`<div class="eyebrow">TỰ LUẬN · TỰ ĐỐI CHIẾU</div><h1 class="title">📝 7 câu tự luận</h1><p class="muted">Mỗi màn hình một câu. Nhập câu trả lời để luyện diễn đạt, sau đó mở hướng dẫn để tự kiểm tra. Trò chơi không tự chấm điểm đoạn văn.</p>${essays.map((q,i)=>`<button class="essay-item" data-essay="${i}">Câu ${i+1}. ${esc(q.short)} <small>Nhấn để mở câu hỏi và phần viết</small></button>`).join('')}`;view.querySelectorAll('[data-essay]').forEach(b=>b.onclick=()=>{essayIndex=Number(b.dataset.essay);reveal=false;go('essay')});setFooter('Chọn một câu tự luận','← Chọn bài khác',home)}
function renderEssay(){const q=essays[essayIndex];view.innerHTML=`<div class="quizhead"><span class="pill">📝 TỰ LUẬN</span><span class="smallcount">CÂU ${essayIndex+1}/7</span></div><div class="progress"><div style="width:${essayIndex/7*100}%"></div></div><h1 class="question">${esc(q.q)}</h1>${essayIndex===6?'<div class="card" style="padding:10px"><strong style="font-size:12px">Sơ đồ thư mục trong đề:</strong><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px"><span class="pill">Ổ D:\\</span><span>→</span><span class="pill">Hoc tap</span><span>→</span><span class="chip">Toan</span><span class="chip">Tin</span></div></div>':''}<textarea id="essayInput" class="essaytext" placeholder="Em hãy trình bày lời giải của mình ở đây...">${esc(progress.essayDrafts[essayIndex]||'')}</textarea><div class="actions"><button class="action soft" id="showAnswer">📖 ${reveal?'Ẩn hướng dẫn':'Xem hướng dẫn giải'}</button><button class="action white" id="save">💾 Lưu câu trả lời</button></div><div id="modelAnswer">${reveal?`<div class="card"><strong style="color:#116781">Gợi ý từ kiến thức SGK:</strong><div class="answer-note">${esc(q.answer)}</div></div>`:''}</div>`;$('#essayInput').addEventListener('input',e=>{progress.essayDrafts[essayIndex]=e.target.value;persist()});$('#save').onclick=()=>{persist();$('#save').textContent='✅ Đã lưu'};$('#showAnswer').onclick=()=>{reveal=!reveal;const s=$('#essayInput').value;progress.essayDrafts[essayIndex]=s;persist();renderEssay()};setFooter('Tự đối chiếu · không chấm máy',essayIndex<6?'Câu tự luận tiếp →':'Xong · Danh sách tự luận',()=>{if(essayIndex<6){essayIndex++;reveal=false;renderEssay()}else go('essays')})}
render();
</script>
</body></html>
